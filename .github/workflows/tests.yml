name: tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  odoo16:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install modules + run tests on Odoo 16
        run: |
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v ${{ github.workspace }}:/mnt/extra-addons \
            odoo:16.0 \
            odoo --db_host=127.0.0.1 --db_user=odoo --db_password=odoo \
              --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
              -d test -i ai_digest,ai_web_editor \
              --test-enable --test-tags /ai_digest,/ai_web_editor --stop-after-init \
            > /tmp/odoo-ci.log 2>&1 \
            || { echo '--- last 40 lines of odoo output ---' >> $GITHUB_STEP_SUMMARY
               tail -40 /tmp/odoo-ci.log >> $GITHUB_STEP_SUMMARY
               echo '--- last 15 lines as annotations ---' >> $GITHUB_STEP_SUMMARY
               tail -15 /tmp/odoo-ci.log | sed 's/::/\\:\\:/g' | while IFS= read -r line; do echo "::error title=odoo output::${line:0:1000}"; done
               exit 1; }
          echo '### Test results' >> $GITHUB_STEP_SUMMARY
          grep -E 'odoo.tests' /tmp/odoo-ci.log | tail -6 >> $GITHUB_STEP_SUMMARY || true
          grep -E '0 failed' /tmp/odoo-ci.log || { echo 'no test summary found' >> $GITHUB_STEP_SUMMARY
               tail -20 /tmp/odoo-ci.log >> $GITHUB_STEP_SUMMARY
               exit 1; }
